# Nightly throughput floor. This is NOT a benchmark: a shared runner's numbers
# are not comparable from one run to the next, and the runner is several times
# slower than a developer laptop. It only catches a catastrophic regression of
# the worker's apply path (the kind that once took the drain rate to 22 tx/s).
#
# The floor is therefore a RATE, never a wall-clock time: both the drain rate
# sampled during the backlog and the rate achieved on the 20k single-row
# backlog must stay at or above 200 source transactions per second. Whether
# the backlog fully drained inside the cap depends on the host, so it is not
# part of the floor; the cap is only there to keep the job bounded.
name: Bench floor

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLOOR_TPS: 200

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pgrx
      - uses: Swatinem/rust-cache@v2

      - name: Run scripts/bench.sh
        run: |
          set -o pipefail
          DRAIN_CAP_S=600 bash scripts/bench.sh 2>&1 | tee bench.out

      - name: Apply the floor
        run: |
          set -eu
          # "drain rate: N tx/s" is sampled over 10 s while a backlog exists.
          sampled=$(grep -oE 'drain rate: [0-9]+ tx/s' bench.out | grep -oE '[0-9]+' | head -n 1 || true)
          # The 20k backlog line reads either "drained 20000 transactions in N ms (R tx/s; ..."
          # or "NOT drained within N s: A of 20000 applied (R tx/s)"; R is what matters.
          backlog=$(grep -E '^(drained [0-9]+ transactions|NOT drained)' bench.out | grep -oE '\([0-9]+ tx/s' | grep -oE '[0-9]+' | head -n 1 || true)
          echo "sampled drain rate: ${sampled:-not found} tx/s; 20k backlog rate: ${backlog:-not found} tx/s; floor: $FLOOR_TPS tx/s"
          if [ -z "$sampled" ] || [ -z "$backlog" ]; then echo "::error::could not parse the bench output"; exit 1; fi
          if [ "$sampled" -lt "$FLOOR_TPS" ]; then echo "::error::sampled drain rate $sampled tx/s is below the floor"; exit 1; fi
          if [ "$backlog" -lt "$FLOOR_TPS" ]; then echo "::error::20k backlog rate $backlog tx/s is below the floor"; exit 1; fi
          if grep -q 'NOT drained' bench.out; then echo "::warning::the 20k backlog did not fully drain inside the cap on this runner (rate was $backlog tx/s, above the floor)"; fi
          echo "floor passed"

      - name: Keep the bench output and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-output
          path: |
            bench.out
            /tmp/nabla-bench-pg.log
          if-no-files-found: ignore
