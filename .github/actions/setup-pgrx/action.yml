# Composite action shared by ci.yml and bench.yml: PostgreSQL 17 from PGDG,
# the pinned Rust toolchain, cargo-pgrx 0.17.0 (cached) initialised against
# the system pg_config. Mirrors docker/Dockerfile.dev, which image.yml builds
# on a schedule so drift between the two shows up.
name: Set up PostgreSQL 17 and cargo-pgrx
description: Install PostgreSQL 17 (server, headers), Rust 1.90 and cargo-pgrx 0.17.0

runs:
  using: composite
  steps:
    - name: Install PostgreSQL 17 from PGDG
      shell: bash
      run: |
        set -euo pipefail
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
        echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
          | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends postgresql-17 postgresql-server-dev-17 libclang-dev
        # The package starts a cluster on 5432; the suite runs its own on 5499
        # with sockets in /tmp, so this only frees memory and CPU.
        sudo systemctl stop postgresql || true
        sudo systemctl disable postgresql || true
        /usr/lib/postgresql/17/bin/pg_config --version

    - name: Rust 1.90
      uses: dtolnay/rust-toolchain@1.90
      with:
        components: rustfmt, clippy

    - name: Cache cargo-pgrx
      id: cargo-pgrx
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/cargo-pgrx
        key: cargo-pgrx-0.17.0-${{ runner.os }}

    - name: Install cargo-pgrx 0.17.0
      if: steps.cargo-pgrx.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install cargo-pgrx --locked --version 0.17.0

    - name: cargo pgrx init against the system server
      shell: bash
      run: cargo pgrx init --pg17 /usr/lib/postgresql/17/bin/pg_config
