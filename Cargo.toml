[package]
name = "nabla"
version = "0.1.0"
edition = "2021"
description = "Non-blocking incremental materialized views for PostgreSQL with delta subscriptions"
license = "AGPL-3.0-or-later"
repository = ""
readme = "README.md"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pgrx_embed_nabla"
path = "./src/bin/pgrx_embed.rs"

[features]
default = ["pg17"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg_test = []

[dependencies]
# Must match the installed cargo-pgrx exactly.
pgrx = "=0.17.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pgrx-tests = "=0.17.0"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
